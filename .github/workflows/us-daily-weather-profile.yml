name: Data Retriever - U.S. Daily Weather Profiling

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas pyarrow duckdb
      - name: Retrieve and profile 2016-2025
        shell: bash
        run: |
          set -euo pipefail
          for year in {2016..2025}; do
            echo "=== Profiling $year ==="
            python projects/us-daily-weather/scripts/retrieve_ghcnd.py --year "$year"
            python projects/us-daily-weather/scripts/profile_ghcnd.py --year "$year"
            rm -f "projects/us-daily-weather/data/processed/us_ghcnd_$year.parquet"
            rm -f "projects/us-daily-weather/data/raw/$year.csv.gz"
          done
      - name: Aggregate station completeness
        run: python projects/us-daily-weather/scripts/aggregate_profiles.py
      - name: Upload compact profiling outputs
        uses: actions/upload-artifact@v4
        with:
          name: us-daily-weather-profiling-2016-2025
          if-no-files-found: error
          retention-days: 14
          path: projects/us-daily-weather/profiling/
