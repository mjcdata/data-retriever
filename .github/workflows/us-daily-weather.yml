name: Data Retriever - U.S. Daily Weather

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode"
        required: true
        default: "single-year"
        type: choice
        options:
          - single-year
          - historical-2016-2025
      year:
        description: "Calendar year for single-year mode"
        required: true
        default: "2025"
        type: string

permissions:
  contents: read

jobs:
  single-year:
    if: ${{ inputs.mode == 'single-year' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas pyarrow

      - name: Retrieve and process GHCN-Daily
        run: python projects/us-daily-weather/scripts/retrieve_ghcnd.py --year "${{ inputs.year }}"

      - name: Upload retrieval outputs
        uses: actions/upload-artifact@v4
        with:
          name: us-daily-weather-${{ inputs.year }}
          if-no-files-found: error
          retention-days: 7
          path: |
            projects/us-daily-weather/data/processed/us_ghcnd_${{ inputs.year }}.parquet
            projects/us-daily-weather/data/samples/us_ghcnd_${{ inputs.year }}_sample.csv
            projects/us-daily-weather/retrieval_records/ghcnd_${{ inputs.year }}_poc.json

  historical:
    if: ${{ inputs.mode == 'historical-2016-2025' }}
    strategy:
      fail-fast: false
      matrix:
        year: [2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas pyarrow

      - name: Retrieve and process GHCN-Daily
        run: python projects/us-daily-weather/scripts/retrieve_ghcnd.py --year "${{ matrix.year }}"

      - name: Upload retrieval outputs
        uses: actions/upload-artifact@v4
        with:
          name: us-daily-weather-${{ matrix.year }}
          if-no-files-found: error
          retention-days: 7
          path: |
            projects/us-daily-weather/data/processed/us_ghcnd_${{ matrix.year }}.parquet
            projects/us-daily-weather/data/samples/us_ghcnd_${{ matrix.year }}_sample.csv
            projects/us-daily-weather/retrieval_records/ghcnd_${{ matrix.year }}_poc.json
