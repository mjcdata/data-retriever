name: Data Retriever - U.S. Daily Weather P1T2 Structure Profile

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile-structure:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas pyarrow

      - name: Retrieve 2016-2025 processed data
        shell: bash
        run: |
          set -euo pipefail
          for year in {2016..2025}; do
            echo "=== Retrieving $year ==="
            python projects/us-daily-weather/scripts/retrieve_ghcnd.py --year "$year"
            rm -f "projects/us-daily-weather/data/raw/$year.csv.gz"
          done

      - name: Build P1T2 dataset structure profile
        run: |
          python projects/us-daily-weather/scripts/profile_structure.py \
            --input-dir projects/us-daily-weather/data/processed \
            --output projects/us-daily-weather/audit/profiles/P1T2_DATASET_STRUCTURE.json

      - name: Upload P1T2 profiling evidence
        uses: actions/upload-artifact@v4
        with:
          name: us-daily-weather-p1t2-structure-profile
          if-no-files-found: error
          retention-days: 14
          path: projects/us-daily-weather/audit/profiles/P1T2_DATASET_STRUCTURE.json
